<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rainbow Music Notes | pixel-art-meta</title>
<style>
  html,body{margin:0;height:100%;background:#0b0b12;display:flex;align-items:center;justify-content:center;
    font:12px ui-monospace,Menlo,Consolas,monospace;color:#9aa;}
  .stage{display:flex;flex-direction:column;align-items:center;gap:10px}
  canvas{ image-rendering:pixelated; image-rendering:crisp-edges;
    height:88vh; width:auto; max-width:92vw;
    background:
      linear-gradient(45deg,#15151f 25%,transparent 25%,transparent 75%,#15151f 75%),
      linear-gradient(45deg,#15151f 25%,transparent 25%,transparent 75%,#15151f 75%),
      #101019;
    background-size:16px 16px; background-position:0 0,8px 8px;
    border-radius:4px; }
  .cap{letter-spacing:3px;font-size:11px;opacity:.7;text-transform:uppercase}
</style>
</head>
<body>
  <div class="stage">
    <canvas id="c" width="112" height="192"></canvas>
    <div class="cap">rainbow music notes · pop in, rise, balloon-pop · transparent</div>
  </div>

<script>
/* Pixel-art music notes that BURST on (expanding ring + sparkle, pop-in scale),
   glide upward on a random two-harmonic drift while their colour sweeps the
   rainbow, then POP OFF like a bubble (note thins to a bubble ring, then bursts
   into drifting droplets). Fully periodic (seamless loop), transparent for
   compositing. Tall 112x192 virtual canvas, integer-scaled, no smoothing. */
const W=112, H=192;
const buf=new Uint8ClampedArray(W*H*4);
function clearT(){ buf.fill(0); }
// alpha-over blend into the transparent buffer
function putA(x,y,r,g,b,a){ x|=0;y|=0; if(x<0||y<0||x>=W||y>=H||a<=0)return;
  const i=(y*W+x)*4, da=buf[i+3]/255, oa=a+da*(1-a);
  if(oa<=0)return; const k=a/oa;
  buf[i]  =buf[i]*(1-k)+r*k; buf[i+1]=buf[i+1]*(1-k)+g*k; buf[i+2]=buf[i+2]*(1-k)+b*k;
  buf[i+3]=oa*255; }

/* HSV -> RGB (h,s,v in 0..1) */
function hsv(h,s,v){ h=(h%1+1)%1; const i=Math.floor(h*6), f=h*6-i,
  p=v*(1-s), q=v*(1-f*s), t=v*(1-(1-f)*s); let r,g,b;
  switch(i%6){ case 0:r=v;g=t;b=p;break; case 1:r=q;g=v;b=p;break; case 2:r=p;g=v;b=t;break;
    case 3:r=p;g=q;b=v;break; case 4:r=t;g=p;b=v;break; default:r=v;g=p;b=q; }
  return [r*255,g*255,b*255]; }
function mulberry(a){ return function(){ a|=0;a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

/* ---- note glyph construction (size-aware pixel masks) ------------------ */
function addUnit(body, hx, hy, flag, s){
  const rx=Math.max(2,Math.round(3*s)), ry=Math.max(1,Math.round(2*s));
  for(let yy=-ry;yy<=ry;yy++) for(let xx=-rx;xx<=rx;xx++){
    const e=(xx/(rx+0.3))**2 + (yy/(ry+0.2))**2;
    if(e<=1) body.add((hx+xx-Math.round(yy*0.5))+','+(hy+yy));    // tilted (italic) note head
  }
  const stemLen=Math.max(6,Math.round(12*s)), stemX=hx+rx, stemTop=hy-stemLen;
  for(let y=stemTop;y<hy;y++){ body.add(stemX+','+y); if(s>1.05) body.add((stemX-1)+','+y); }   // stem (thicker when near)
  if(flag){ const f=[[0,0],[1,0],[1,1],[2,1],[2,2],[1,2],[1,3],[2,3],[1,4]];
    for(const [dx,dy] of f) body.add((stemX+Math.round(dx*s))+','+(stemTop+Math.round(dy*s))); }  // eighth flag
  return [stemX,stemTop];
}
function noteBody(type, cx, cy, s){
  const body=new Set(), r1=Math.round(1*s), r4=Math.round(4*s), r5=Math.round(5*s);
  if(type==='eighth'){ addUnit(body, cx-r1, cy, true, s); }
  else if(type==='quarter'){ addUnit(body, cx-r1, cy, false, s); }
  else { const a=addUnit(body, cx-r5, cy+r1, false, s), b=addUnit(body, cx+r4, cy-r1, false, s);
    const x0=Math.min(a[0],b[0]), x1=Math.max(a[0],b[0]), th=Math.round(2*s)+1;
    for(let x=x0;x<=x1;x++){ const yy=a[1]+(b[1]-a[1])*(x-a[0])/((b[0]-a[0])||1);
      for(let k=0;k<th;k++) body.add(x+','+Math.round(yy+k)); } }
  return body;
}
function noteHeads(type,cx,cy,s){ const r2=Math.round(2*s),r3=Math.round(3*s),r6=Math.round(6*s),r1=Math.round(1*s);
  return type==='beamed'? [[cx-r6,cy],[cx+r3,cy-r2]] : [[cx-r2,cy-r1]]; }
function outlineOf(body){ const out=new Set();
  for(const key of body){ const c=key.indexOf(','), x=+key.slice(0,c), y=+key.slice(c+1);
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const k=(x+dx)+','+(y+dy); if(!body.has(k)) out.add(k); } }
  return out; }

// draw a note at size s (crisp — built at target size, not pixel-scaled)
function drawNote(type, cx, cy, hue, alpha, s){
  if(alpha<=0||s<=0.05) return; cx|=0; cy|=0;
  const body=noteBody(type, cx, cy, s);
  const [br,bg,bb]=hsv(hue,0.88,1.0), [or_,og,ob]=hsv(hue,0.95,0.42);
  const out=outlineOf(body);
  for(const key of out){ const c=key.indexOf(','); putA(+key.slice(0,c),+key.slice(c+1),or_,og,ob,alpha*0.9); }
  for(const key of body){ const c=key.indexOf(','); putA(+key.slice(0,c),+key.slice(c+1),br,bg,bb,alpha); }
  for(const [hx,hy] of noteHeads(type,cx,cy,s)){ const [pr,pg,pb]=hsv(hue,0.25,1.0);
    putA(hx,hy,pr,pg,pb,alpha); putA(hx+1,hy,pr,pg,pb,alpha*0.7); }
}

/* ---- pop effect helpers ------------------------------------------------ */
function drawRing(cx,cy,r,hue,alpha,sat,val){ if(r<0.5||alpha<=0)return;
  const [R,G,B]=hsv(hue,sat,val), n=Math.max(8,(2*Math.PI*r)|0);
  for(let i=0;i<n;i++){ const a=i/n*2*Math.PI; putA(cx+Math.cos(a)*r, cy+Math.sin(a)*r, R,G,B, alpha); } }
function sparkle(cx,cy,s,hue,alpha){ if(s<0.5||alpha<=0)return;
  const [r,g,b]=hsv(hue,0.3,1.0); const S=Math.round(s);
  for(let k=-S;k<=S;k++){ const f=1-Math.abs(k)/(S+1); putA(cx+k,cy,r,g,b,alpha*f); putA(cx,cy+k,r,g,b,alpha*f); }
  putA(cx,cy,255,255,255,alpha); }

/* ---- the field: each note POPS IN from nothing at a random in-frame spot,
   rises a short random distance at its own depth (size), then POPS like a
   balloon into confetti and vanishes. Seamless loop (periodic in p).        */
const TYPES=['eighth','quarter','beamed','eighth','quarter'];
const NOTES=[]; (function(){ const R=mulberry(4471); const n=17;
  for(let i=0;i<n;i++){ const nd=8+(R()*5|0), drops=[];
    for(let d=0;d<nd;d++) drops.push({a:d/nd*6.283+R()*0.8, sp:0.6+R()*0.9, sz:1+(R()<0.5?1:0), hue:R()*0.34-0.17});
    const scale=0.55 + R()*R()*0.9;                 // z-depth: biased small, a few big/near
    const riseDist=12 + R()*38;                      // random, limited rise (never leaves frame)
    const topPad=20 + 26*scale;
    const y0=Math.min(H-20, riseDist+topPad + R()*Math.max(8, H-riseDist-topPad-40));
    NOTES.push({
      x0: Math.round(8 + ((i+R())/n)*(W-16)), y0, scale, riseDist,   // stratified across width
      type: TYPES[(R()*TYPES.length)|0],
      phase: R(), cyc: R()<0.32?2:1,                 // some pop twice per loop -> less uniform
      swayA: 1.5+R()*4, swayK:1+(R()*2|0), swayPh:R()*6.283,
      hueOff: R(), drops,
    });
  }
})();

const B=0.16, P=0.26;                                 // pop-in / balloon-pop fractions of life
function render(p){
  clearT();
  // draw far (small) first, near (big) last -> depth overlap
  const list=NOTES.map(nt=>({nt, life:((p*nt.cyc+nt.phase)%1+1)%1})).sort((a,b)=>a.nt.scale-b.nt.scale);
  for(const {nt,life} of list){
    const sc=nt.scale;
    const y = nt.y0 - nt.riseDist*life;                               // rises as it lives
    const x = nt.x0 + sc*nt.swayA*Math.sin(life*2*Math.PI*nt.swayK + nt.swayPh);
    const hue=( p + nt.hueOff + life*0.2 )%1;
    const baseA = 0.70 + 0.30*Math.min(1,(sc-0.55)/0.9);              // nearer = brighter

    if(life < B){                                                    // ---- POP IN from nothing ----
      const pr=life/B, ease=1-(1-pr)*(1-pr);
      const s = sc*(pr<0.6 ? ease*1.18 : 1.18-(pr-0.6)/0.4*0.18);    // 0 -> overshoot -> settle
      drawRing(x,y, (1+pr*5)*sc, hue, (1-pr)*0.8, 0.5, 1.0);
      sparkle(x,y, 4*sc*(1-pr), hue, (1-pr)*0.9);
      drawNote(nt.type, x, y, hue, Math.min(1,pr*1.7)*baseA, s);
    } else if(life > 1-P){                                           // ---- BALLOON POP ----
      const pr=(life-(1-P))/P;
      if(pr<0.22){                                                   // quick stretch (anticipation)
        drawNote(nt.type, x, y, hue, baseA, sc*(1+pr*0.9));
      } else {                                                       // BANG -> confetti burst
        const pp=(pr-0.22)/0.78;
        if(pp<0.14){ const fr=Math.round(3*sc); const [wr,wg,wb]=hsv(hue,0.1,1);   // bright flash core
          for(let yy=-fr;yy<=fr;yy++)for(let xx=-fr;xx<=fr;xx++) if(xx*xx+yy*yy<=fr*fr) putA(x+xx,y+yy,wr,wg,wb,(1-pp/0.14)*0.95); }
        drawRing(x,y, (3+pp*11)*sc, hue, (1-pp)*0.9, 0.55, 1.0);     // tight shockwave
        for(const d of nt.drops){ const rr=pp*15*sc*d.sp,
            dx=x+Math.cos(d.a)*rr, dy=y+Math.sin(d.a)*rr - pp*5*sc;  // confetti flies out + drifts up
          const [cr,cg,cb]=hsv((hue+d.hue+1)%1,0.85,1.0), a=(1-pp*0.9)*0.98;
          putA(dx,dy,cr,cg,cb,a); putA(dx+(d.sz>1?1:0),dy,cr,cg,cb,a*0.8);
          if(d.sz>1){ putA(dx,dy+1,cr,cg,cb,a*0.8); putA(dx+1,dy+1,cr,cg,cb,a*0.55); } }
      }
    } else {                                                        // ---- RISE ----
      drawNote(nt.type, x, y, hue, baseA, sc);
    }
  }
  return buf;
}

if(typeof document!=='undefined'){
  const cvs=document.getElementById('c'); const ctx=cvs.getContext('2d'); ctx.imageSmoothingEnabled=false;
  const LOOP=5.0; let t0=0;
  function frame(ts){ if(!t0)t0=ts; const p=(((ts-t0)*0.001)%LOOP)/LOOP;
    ctx.putImageData(new ImageData(render(p),W,H),0,0); requestAnimationFrame(frame); }
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
