<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rainbow Music Notes | pixel-art-meta</title>
<style>
  html,body{margin:0;height:100%;background:#0b0b12;display:flex;align-items:center;justify-content:center;
    font:12px ui-monospace,Menlo,Consolas,monospace;color:#9aa;}
  .stage{display:flex;flex-direction:column;align-items:center;gap:10px}
  canvas{ image-rendering:pixelated; image-rendering:crisp-edges;
    width:min(82vh,82vw); height:min(82vh,82vw);
    background:
      linear-gradient(45deg,#15151f 25%,transparent 25%,transparent 75%,#15151f 75%),
      linear-gradient(45deg,#15151f 25%,transparent 25%,transparent 75%,#15151f 75%),
      #101019;
    background-size:16px 16px; background-position:0 0,8px 8px;
    border-radius:4px; }
  .cap{letter-spacing:3px;font-size:11px;opacity:.7;text-transform:uppercase}
</style>
</head>
<body>
  <div class="stage">
    <canvas id="c" width="128" height="128"></canvas>
    <div class="cap">rainbow music notes · floating loop · transparent</div>
  </div>

<script>
/* Pixel-art music notes drifting upward on a gentle sway. Each note fades in,
   rises, and fades out while its colour sweeps the rainbow. Fully periodic
   (seamless loop) and transparent for compositing. 128x128 virtual canvas,
   integer-scaled, no smoothing. */
const W=128, H=128;
const buf=new Uint8ClampedArray(W*H*4);
function clearT(){ buf.fill(0); }
// alpha-over blend into the transparent buffer (premultiplied-free)
function putA(x,y,r,g,b,a){ x|=0;y|=0; if(x<0||y<0||x>=W||y>=H||a<=0)return;
  const i=(y*W+x)*4, da=buf[i+3]/255, oa=a+da*(1-a);
  if(oa<=0)return; const k=a/oa;
  buf[i]  =buf[i]*(1-k)+r*k; buf[i+1]=buf[i+1]*(1-k)+g*k; buf[i+2]=buf[i+2]*(1-k)+b*k;
  buf[i+3]=oa*255; }

/* HSV -> RGB (h,s,v in 0..1) */
function hsv(h,s,v){ h=(h%1+1)%1; const i=Math.floor(h*6), f=h*6-i,
  p=v*(1-s), q=v*(1-f*s), t=v*(1-(1-f)*s); let r,g,b;
  switch(i%6){ case 0:r=v;g=t;b=p;break; case 1:r=q;g=v;b=p;break; case 2:r=p;g=v;b=t;break;
    case 3:r=p;g=q;b=v;break; case 4:r=t;g=p;b=v;break; default:r=v;g=p;b=q; }
  return [r*255,g*255,b*255]; }

/* ---- note glyph construction (pixel masks) ----------------------------- */
// add one note unit (head + stem[, flag]) to a Set of "x,y" body pixels.
// returns the stem-top [x,y] so a beam can connect two of them.
function addUnit(body, hx, hy, flag){
  const rx=3, ry=2;
  for(let yy=-ry;yy<=ry;yy++) for(let xx=-rx;xx<=rx;xx++){
    const e=(xx/ (rx+0.3))**2 + (yy/(ry+0.2))**2;
    if(e<=1) body.add((hx+xx-Math.round(yy*0.5))+','+(hy+yy));    // tilted (italic) note head
  }
  const stemX=hx+rx, stemTop=hy-12;
  for(let y=stemTop;y<hy;y++) body.add(stemX+','+y);              // stem
  if(flag){ const f=[[0,0],[1,0],[1,1],[2,1],[2,2],[1,2],[1,3],[2,3],[1,4]];
    for(const [dx,dy] of f) body.add((stemX+dx)+','+(stemTop+dy)); }  // eighth-note flag
  return [stemX,stemTop];
}
function noteBody(type, cx, cy){
  const body=new Set();
  if(type==='eighth'){ addUnit(body, cx-1, cy, true); }
  else if(type==='quarter'){ addUnit(body, cx-1, cy, false); }
  else { // beamed pair
    const a=addUnit(body, cx-5, cy+1, false), b=addUnit(body, cx+4, cy-1, false);
    const x0=Math.min(a[0],b[0]), x1=Math.max(a[0],b[0]);
    for(let x=x0;x<=x1;x++){ const yy=a[1]+(b[1]-a[1])*(x-a[0])/((b[0]-a[0])||1);
      body.add(x+','+Math.round(yy)); body.add(x+','+Math.round(yy+1)); body.add(x+','+Math.round(yy+2)); } // beam
  }
  return body;
}
// heads (for highlight placement): approx upper-left of each head
function noteHeads(type,cx,cy){ return type==='beamed'? [[cx-6,cy],[cx+3,cy-2]] : [[cx-2,cy-1]]; }

function drawNote(type, cx, cy, hue, alpha){
  if(alpha<=0) return;
  const body=noteBody(type, cx|0, cy|0);
  const [br,bg,bb]=hsv(hue,0.88,1.0);                 // vivid body
  const [or_,og,ob]=hsv(hue,0.95,0.42);               // darker outline (same hue family)
  // outline: body-adjacent empty pixels
  const out=new Set();
  for(const key of body){ const [x,y]=key.split(',').map(Number);
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const k=(x+dx)+','+(y+dy);
      if(!body.has(k)) out.add(k); } }
  for(const key of out){ const [x,y]=key.split(',').map(Number); putA(x,y,or_,og,ob,alpha*0.9); }
  for(const key of body){ const [x,y]=key.split(',').map(Number); putA(x,y,br,bg,bb,alpha); }
  // pale specular on the head(s)
  for(const [hx,hy] of noteHeads(type,cx|0,cy|0)){
    const [pr,pg,pb]=hsv(hue,0.25,1.0);
    putA(hx,hy,pr,pg,pb,alpha); putA(hx+1,hy,pr,pg,pb,alpha*0.7); }
}

/* ---- the floating field (seamless: every term periodic in p in [0,1)) --- */
const TYPES=['eighth','quarter','beamed','eighth','eighth','quarter'];
const NOTES=[]; (function(){ const R=mulberry(1337);
  const n=9;
  for(let i=0;i<n;i++) NOTES.push({
    x: 14 + R()*100,
    type: TYPES[(R()*TYPES.length)|0],
    phase: i/n + R()*0.03,
    swayAmp: 5 + R()*9,
    swayK: 1 + (R()*2|0),            // integer sway cycles per life -> loops
    swayPh: R()*6.283,
    hueOff: R(),
    size: 0.9 + R()*0.3,
  });
})();
function mulberry(a){ return function(){ a|=0;a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

const CYCLES=1;                      // full rainbow turns per loop
function render(p){
  clearT();
  // draw newest (lowest) last so rising notes overlap naturally
  const order=NOTES.map((nt,i)=>({nt,life:((p+nt.phase)%1+1)%1})).sort((a,b)=>b.life-a.life);
  for(const {nt,life} of order){
    const y = (H+10) - life*(H+22);                      // below bottom -> above top
    const x = nt.x + nt.swayAmp*Math.sin(life*2*Math.PI*nt.swayK + nt.swayPh);
    let a;                                                // appear -> hold -> disappear
    if(life<0.16) a=life/0.16; else if(life>0.82) a=(1-life)/0.18; else a=1;
    a=Math.max(0,Math.min(1,a))*0.96;
    const hue=( p*CYCLES + nt.hueOff + life*0.25 )%1;     // rainbow sweep (periodic)
    drawNote(nt.type, x, y, hue, a);
  }
  return buf;
}

if(typeof document!=='undefined'){
  const cvs=document.getElementById('c'); const ctx=cvs.getContext('2d'); ctx.imageSmoothingEnabled=false;
  const LOOP=4.2; let t0=0;
  function frame(ts){ if(!t0)t0=ts; const p=(((ts-t0)*0.001)%LOOP)/LOOP;
    ctx.putImageData(new ImageData(render(p),W,H),0,0); requestAnimationFrame(frame); }
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
