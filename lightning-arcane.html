<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Arcane Whip — Purple Electric Fire | pixel-art-meta</title>
<style>
  html,body{margin:0;min-height:100%;color:#c9b2e8;font:13px ui-monospace,Menlo,Consolas,monospace;
    background:#120c1e;
    background-image:
      linear-gradient(45deg,#0e0918 25%,transparent 25%,transparent 75%,#0e0918 75%),
      linear-gradient(45deg,#0e0918 25%,transparent 25%,transparent 75%,#0e0918 75%);
    background-size:24px 24px; background-position:0 0,12px 12px;}
  h1{font-size:15px;color:#efe4ff;text-align:center;margin:16px 0 2px}
  p.sub{text-align:center;margin:0 0 10px;color:#8f7ca8}
  .row{display:flex;gap:14px;justify-content:center;align-items:flex-start;flex-wrap:wrap;padding:6px 14px 24px}
  .cell{display:flex;flex-direction:column;align-items:center;gap:6px}
  canvas{ image-rendering:pixelated; image-rendering:crisp-edges; height:60vh; width:auto;
    outline:1px solid rgba(200,160,255,.14); border-radius:3px; }
  .lab{color:#d6b8ff;letter-spacing:1px}
  .lab b{color:#fff}
</style>
</head>
<body>
  <h1>ARCANE WHIP — PURPLE ELECTRIC FIRE</h1>
  <p class="sub">a living whip of electricity coils &amp; whips around the core, organically — like a wizard spell</p>
  <div class="row" id="row"></div>

<script>
/* Arcane whip: a CONTINUOUS bolt whose shape is driven by smooth evolving
   harmonics so it flows/undulates and coils around the core (rotating) like a
   whip of electric fire. Crackling tendrils fork off it, embers drift away.
   Additive purple glow + white-hot core -> tonemap -> alpha (transparent). */
const GW=300, GH=300, CX=150, CY=150, LEN=120, MARGIN=8, REFRESH=60, N=GW*GH;
const acc=new Float32Array(N*3);
const PURP=[.52,.16,1], VIOLET=[.74,.45,1], MAG=[.95,.5,1], WHITE=[1,1,1];

const OPTS=[
  {id:'A', name:'Coil',   coil:3.6, branches:5,  blen:12, disp:0.9, wob:1.0, thick:1},
  {id:'B', name:'Lash',   coil:5.2, branches:9,  blen:15, disp:1.0, wob:1.25,thick:1},
  {id:'C', name:'Serpent',coil:2.4, branches:4,  blen:13, disp:0.8, wob:0.9, thick:2},
  {id:'D', name:'Storm',  coil:6.6, branches:13, blen:13, disp:1.2, wob:1.4, thick:1},
];

function add(x,y,r,g,b){ x|=0;y|=0; if(x<MARGIN||y<MARGIN||x>=GW-MARGIN||y>=GH-MARGIN)return; const i=(y*GW+x)*3; acc[i]+=r;acc[i+1]+=g;acc[i+2]+=b; }
function glow(cx,cy,rad,c,inten){ const x0=Math.max(0,(cx-rad)|0),x1=Math.min(GW-1,(cx+rad)|0),y0=Math.max(0,(cy-rad)|0),y1=Math.min(GH-1,(cy+rad)|0);
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){ const dx=x-cx,dy=y-cy,d=Math.sqrt(dx*dx+dy*dy); if(d>rad)continue; let f=1-d/rad; f*=f; add(x,y,c[0]*f*inten,c[1]*f*inten,c[2]*f*inten); } }

// the flowing whip path (canvas points), evolving smoothly with time+rotation
function whipPath(opt, t, rot){
  const M=46, pts=[];
  for(let i=0;i<=M;i++){ const u=i/M, r=u*LEN;
    const a = rot + u*opt.coil                       // spiral coil that rotates
            + 0.55*Math.sin(u*3.0 + t*1.8)           // slow organic sway
            + 0.28*Math.sin(u*6.0 - t*1.2);
    const tip = 0.2 + u*1.15;                         // whip harder toward the tip
    const wob = opt.wob*( tip*(8*Math.sin(u*4.0+t*2.0) + 4*Math.sin(u*8.0-t*1.5))
                        + 5.0*Math.sin(u*22+t*6.0) + 3.4*Math.sin(u*38-t*8.0) + 2.2*Math.sin(u*60+t*11) );  // jagged electric crackle
    const pa = a + Math.PI/2;
    pts.push([ CX+Math.cos(a)*r + Math.cos(pa)*wob, CY+Math.sin(a)*r + Math.sin(pa)*wob ]);
  }
  return pts;
}
function drawPolyline(pts, coreC, glowC, coreW, glowR, inten){
  for(let i=0;i<pts.length-1;i++){ const a=pts[i],b=pts[i+1],L=Math.hypot(b[0]-a[0],b[1]-a[1]),S=Math.max(1,Math.ceil(L));
    for(let s=0;s<=S;s++){ const k=s/S, x=a[0]+(b[0]-a[0])*k, y=a[1]+(b[1]-a[1])*k;
      glow(x,y, glowR*1.9, glowC, inten*0.20);          // soft fire haze
      glow(x,y, glowR, glowC, inten*0.55);
      glow(x,y, coreW, WHITE, inten*0.95); glow(x,y, coreW*0.6, coreC, inten); } }
}

// crackling tendrils forking off a canvas-space path (regenerated each call)
function tendrils(path, opt){
  const out=[]; const disp=opt.disp;
  function grow(px,py, ang, len, depth){
    let pts=[[px,py],[px+Math.cos(ang)*len, py+Math.sin(ang)*len]];
    for(let it=0;it<5;it++){ const np=[];
      for(let i=0;i<pts.length-1;i++){ const a=pts[i],b=pts[i+1]; np.push(a);
        const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2,nx=-(b[1]-a[1]),ny=(b[0]-a[0]),nl=Math.hypot(nx,ny)||1,o=(Math.random()*2-1)*disp*(len/12);
        np.push([mx+nx/nl*o,my+ny/nl*o]); }
      np.push(pts[pts.length-1]); pts=np; disp; }
    // taper the tip
    const raw=[]; for(let i=0;i<pts.length-1;i++){ const a=pts[i],b=pts[i+1],L=Math.hypot(b[0]-a[0],b[1]-a[1]),S=Math.max(1,Math.ceil(L));
      for(let s=0;s<=S;s++){ const k=s/S; raw.push([a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k]); } }
    for(let i=0;i<raw.length;i++){ const u=raw.length>1?i/(raw.length-1):0; if(u>0.5&&Math.random()<(u-0.5)/0.5*0.9)continue; out.push(raw[i]); }
    if(depth>0){ const nb=1+(Math.random()*2|0); for(let i=0;i<nb;i++) if(Math.random()<0.6){ const tp=pts[(0.5*pts.length)|0]; grow(tp[0],tp[1], ang+(Math.random()*2-1)*1.0, len*0.6, depth-1); } }
  }
  for(let b=0;b<opt.branches;b++){ const vi=6+((path.length-8)*Math.random())|0; const p=path[vi], q=path[Math.min(path.length-1,vi+1)];
    const base=Math.atan2(q[1]-p[1],q[0]-p[0]); const ang=base+(Math.random()<0.5?-1:1)*(0.5+Math.random()*0.8);
    grow(p[0],p[1], ang, opt.blen*(0.5+Math.random()*1.0), 1); }
  return out;
}

function makeStrike(opt){
  let tend=[], lastGen=-1e9, embers=[], phase=Math.random()*6.283;
  const out=new Uint8ClampedArray(N*4);
  return { out, advance(now){
    const t=now*0.001 + phase, rot=t*0.5;
    acc.fill(0);
    const path=whipPath(opt,t,rot);
    // core (magic origin) — pulsing
    const pulse=0.6+0.4*Math.sin(t*3);
    glow(CX,CY, 10, PURP, 0.5*pulse); glow(CX,CY,5,VIOLET,0.7*pulse); glow(CX,CY,2.4,WHITE,1.1*pulse);
    // the whip itself (bright, tapered — thinner toward tip)
    const fl=0.8+0.2*Math.sin(t*17);
    drawPolyline(path, MAG, PURP, opt.thick>=2?2.0:1.5, 3.7, 1.2*fl);
    // crackling tendrils (regenerated at the crackle rate)
    if(now-lastGen>=REFRESH){ tend=tendrils(path,opt); lastGen=now; }
    for(const p of tend){ glow(p[0],p[1],1.9,PURP,0.5); add(p[0],p[1],WHITE[0]*0.7,WHITE[1]*0.7,WHITE[2]*0.7); }
    // embers of electric fire drifting off the whip
    if(embers.length<260){ for(let k=0;k<5;k++){ const pp=path[(6+Math.random()*(path.length-8))|0];
      embers.push({x:pp[0],y:pp[1],vx:(Math.random()*2-1)*0.8,vy:(Math.random()*2-1)*0.8-0.18,life:0,max:16+Math.random()*20}); } }
    const ne=[]; for(const e of embers){ e.life++; e.x+=e.vx; e.y+=e.vy; e.vy-=0.006; const lf=1-e.life/e.max; if(lf<=0)continue;
      const c=lf>0.6?WHITE:lf>0.3?VIOLET:PURP; glow(e.x,e.y,1.7,c,0.6*lf); ne.push(e); }
    embers=ne;
    // compose: purple-weighted tonemap + alpha
    for(let i=0;i<N;i++){ let r=acc[i*3],g=acc[i*3+1],b=acc[i*3+2];
      r=1-Math.exp(-r*1.05); g=1-Math.exp(-g*0.8); b=1-Math.exp(-b*1.5);
      const a=Math.min(1,Math.max(r,g,b)*1.9);
      out[i*4]=r*255; out[i*4+1]=g*255; out[i*4+2]=b*255; out[i*4+3]=a*255; }
    return out;
  } };
}

if(typeof document!=='undefined'){
  const strikes=OPTS.map(o=>{
    const cell=document.createElement('div'); cell.className='cell';
    const cvs=document.createElement('canvas'); cvs.width=GW; cvs.height=GH; cell.appendChild(cvs);
    const lab=document.createElement('div'); lab.className='lab'; lab.innerHTML=o.id+' · <b>'+o.name+'</b>'; cell.appendChild(lab);
    document.getElementById('row').appendChild(cell);
    const ctx=cvs.getContext('2d'); ctx.imageSmoothingEnabled=false;
    return {s:makeStrike(o), ctx};
  });
  function frame(ts){ for(const o of strikes){ const buf=o.s.advance(ts); o.ctx.putImageData(new ImageData(buf,GW,GH),0,0); } requestAnimationFrame(frame); }
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
