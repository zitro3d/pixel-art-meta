<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Arcane Lightning — White/Purple Circular | pixel-art-meta</title>
<style>
  html,body{margin:0;min-height:100%;color:#c9b2e8;font:13px ui-monospace,Menlo,Consolas,monospace;
    background:#14101f;
    background-image:
      linear-gradient(45deg,#0f0b18 25%,transparent 25%,transparent 75%,#0f0b18 75%),
      linear-gradient(45deg,#0f0b18 25%,transparent 25%,transparent 75%,#0f0b18 75%);
    background-size:24px 24px; background-position:0 0,12px 12px;}
  h1{font-size:15px;color:#efe4ff;text-align:center;margin:16px 0 2px}
  p.sub{text-align:center;margin:0 0 10px;color:#8f7ca8}
  .row{display:flex;gap:14px;justify-content:center;align-items:flex-start;flex-wrap:wrap;padding:6px 14px 24px}
  .cell{display:flex;flex-direction:column;align-items:center;gap:6px}
  canvas{ image-rendering:pixelated; image-rendering:crisp-edges; height:62vh; width:auto;
    background:rgba(180,150,255,.04); outline:1px solid rgba(200,160,255,.14); border-radius:3px; }
  .lab{color:#d6b8ff;letter-spacing:1px}
  .lab b{color:#fff}
</style>
</head>
<body>
  <h1>ARCANE LIGHTNING — WHITE / PURPLE · CIRCULAR</h1>
  <p class="sub">energy core charges &rarr; bolts erupt &amp; rotate around it (magical swirl) · animated tendrils · re-strikes &amp; fades</p>
  <div class="row" id="row"></div>

<script>
/* Arcane variant: same procedural bolt + animated recursive tendrils + multi-
   stroke re-strike + tapered tips as the green set, but WHITE/PURPLE and the
   whole bolt is transformed to erupt from a central core and ROTATE around it
   (with a spiral curl) for a magical circular motion. */
const GW=340, GH=340, CX=170, CY=170, UNIT=85, REFRESH=70, SCALE=56, LAND=112, MARGIN=8, CURVE=0.34, ROT=0.65;
const BOLT=[0x8A,0x35,0xF0], BRIGHT=[0xC6,0x99,0xFF], WHITE=[0xFF,0xFF,0xFF];

const OPTS=[
  {id:'A', name:'Bolt',   disp:0.20, detail:6, branches:4, blen:0.34, thick:1},
  {id:'B', name:'Forked', disp:0.19, detail:6, branches:8, blen:0.42, thick:1},
  {id:'C', name:'Heavy',  disp:0.16, detail:6, branches:5, blen:0.36, thick:2},
  {id:'D', name:'Wild',   disp:0.30, detail:7, branches:11,blen:0.34, thick:1},
];
const SEQ=[
  ['ball',0.5,2],['ball',1.0,2],                 // charge (core)
  ['burst',0.3,1],['burst',0.85,1],               // BOOM
  ['strike',0,1],['glow',1.0,1],['empty',0,1],    // stroke 1 (fires out, rotating)
  ['strike',0,1],['glow',1.0,1],['empty',0,1],    // stroke 2 (new angle)
  ['strike',0,1],['glow',1.0,2],                  // stroke 3
  ['tfade',0.55,1],['tfade',0.28,1],              // tendrils fade
  ['fade',0.5,1],['fade',0.2,1],                  // channel fades
  ['empty',0,9],
];

/* ---- geometry ---------------------------------------------------------- */
function displace(p0,p1,disp,detail){
  let pts=[p0,p1];
  for(let it=0;it<detail;it++){ const np=[];
    for(let i=0;i<pts.length-1;i++){ const a=pts[i],b=pts[i+1]; np.push(a);
      const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2,nx=-(b[1]-a[1]),ny=(b[0]-a[0]),nl=Math.hypot(nx,ny)||1,o=(Math.random()*2-1)*disp;
      np.push([mx+nx/nl*o, my+ny/nl*o]); }
    np.push(pts[pts.length-1]); pts=np; disp*=0.52; }
  return pts;
}
function line(x0,y0,x1,y1,out){
  let dx=Math.abs(x1-x0),dy=Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1,err=dx-dy,x=x0,y=y0;
  for(;;){ out.push([x,y]); if(x===x1&&y===y1)break; const e2=2*err; if(e2>-dy){err-=dy;x+=sx;} if(e2<dx){err+=dx;y+=sy;} }
}
function raster(poly){ const out=[]; for(let i=0;i<poly.length-1;i++){ const a=poly[i],b=poly[i+1],seg=[];
  line(Math.round(a[0]),Math.round(a[1]),Math.round(b[0]),Math.round(b[1]),seg);
  for(const p of seg){ if(!out.length||out[out.length-1][0]!==p[0]||out[out.length-1][1]!==p[1]) out.push(p); } } return out; }

// recursive tendrils in LOCAL frame (origin 0,0, bolt along +Y). Regenerated each call.
function tendrils(spinePoly, opt){
  let out=[];
  function grow(fromPoly, d0, detail, blen, depth){
    const lower=Math.random()<0.5;
    const t = lower ? 0.60+Math.random()*0.36 : 0.18+Math.random()*0.5;
    const vi=(t*(fromPoly.length-1))|0;
    const a=fromPoly[vi], b=fromPoly[Math.min(fromPoly.length-1,vi+1)];
    const spread = lower ? 0.35 : 0.7;
    const ang=Math.atan2(b[1]-a[1],b[0]-a[0]) + (Math.random()<0.5?-1:1)*(0.35+Math.random()*spread);
    const ln=blen*LAND*(0.28+Math.random()*0.66)*(lower?1.25:1.0);
    const poly=displace(a,[a[0]+Math.cos(ang)*ln,a[1]+Math.sin(ang)*ln], d0, Math.max(3,detail-1));
    const raw=raster(poly);
    for(let i=0;i<raw.length;i++){ const u=raw.length>1? i/(raw.length-1):0;
      if(u>0.5 && Math.random() < (u-0.5)/0.5*0.9) continue; out.push(raw[i]); }   // TAPER tips
    if(depth>0){ const sub=1+(Math.random()*2|0); for(let i=0;i<sub;i++) if(Math.random()<0.7) grow(poly,d0*0.7,detail-1,blen*0.62,depth-1); }
  }
  const disp0=SCALE*opt.disp;
  for(let bI=0;bI<opt.branches;bI++) grow(spinePoly, disp0*0.6, opt.detail, opt.blen, 1);
  if(opt.thick>=2) out=out.concat(out.map(p=>[p[0]+1,p[1]]));
  return out;
}
function edges(pts, rad){ const s=new Set(pts.map(p=>p[0]+','+p[1])), out=new Set(), res=[];
  for(const [x,y] of pts) for(let dx=-rad;dx<=rad;dx++) for(let dy=-rad;dy<=rad;dy++){
    if((dx||dy)===0||Math.abs(dx)+Math.abs(dy)>rad) continue; const k=(x+dx)+','+(y+dy);
    if(!s.has(k)&&!out.has(k)){ out.add(k); res.push([x+dx,y+dy]); } } return res; }

/* ---- one strike (canvas-free core) ------------------------------------ */
function makeStrike(opt){
  const buf=new Uint8ClampedArray(GW*GH*4);
  let spinePoly, spine, spray, tend=[], idx=0, stepStart=0, lastGen=-1e9, strokeAngle=Math.random()*6.283, drawTheta=0;
  function newStroke(){
    strokeAngle += 0.8;                                       // each stroke fires at a new angle
    const len=LAND+(Math.random()*44-18), exLocal=(Math.random()*18-9), disp0=SCALE*opt.disp;
    spinePoly=displace([0,0],[exLocal,len],disp0,opt.detail);
    let s=raster(spinePoly); if(opt.thick>=2) s=s.concat(s.map(p=>[p[0]+1,p[1]]));
    spine=s;
    spray=[]; const ns=8+(Math.random()*6|0);
    for(let i=0;i<ns;i++){ const a=Math.random()*Math.PI, r=1+Math.random()*6; spray.push([exLocal+Math.cos(a)*r*1.3, len+Math.abs(Math.sin(a))*r*0.7]); }
    tend=tendrils(spinePoly,opt);
  }
  // transform a LOCAL point: spiral-curl bend, then rotate by drawTheta about the core
  function T(p){ let lx=p[0], ly=p[1];
    lx += CURVE*(ly*ly)/LAND;                                 // parabolic curl -> magical spiral
    const cs=Math.cos(drawTheta), sn=Math.sin(drawTheta);
    return [ CX + lx*cs - ly*sn, CY + lx*sn + ly*cs ]; }
  function set(x,y,c){ x|=0;y|=0; if(x<MARGIN||y<MARGIN||x>=GW-MARGIN||y>=GH-MARGIN)return; const i=(y*GW+x)*4; buf[i]=c[0];buf[i+1]=c[1];buf[i+2]=c[2];buf[i+3]=255; }
  function putC(pts,c){ for(const [x,y] of pts) set(x,y,c); }          // canvas-space
  function coreC(r){ for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++){ const d=Math.hypot(x,y); if(d<=r) set(CX+x,CY+y, d<r*0.5?WHITE:BRIGHT); } }
  function compose(step){
    buf.fill(0);
    const [k,arg]=step;
    if(k==='empty') return;
    if(k==='ball'){ const r=3+arg*7;
      for(let y=-r-2;y<=r+2;y++) for(let x=-r-2;x<=r+2;x++){ const d=Math.hypot(x,y);
        if(d>r){ if(d<r+2 && Math.random()<0.3*(1-(d-r)/2)) set(CX+x,CY+y,BRIGHT); continue; }
        if(d>r*0.8 && Math.random()<(d-r*0.8)/(r*0.2+0.01)*0.6) continue;
        set(CX+x,CY+y, d<r*0.38?WHITE : d<r*0.72?BRIGHT : BOLT); }
      set(CX,CY,WHITE);
    } else if(k==='burst'){ const R=5+arg*16, th=Math.max(1,(3*(1-arg))|0)+1;
      for(let deg=0;deg<360;deg+=3){ const a=deg*Math.PI/180;
        for(let t=0;t<th;t++){ const rr=R-t; set(Math.round(CX+Math.cos(a)*rr),Math.round(CY+Math.sin(a)*rr), t===0?WHITE:BRIGHT); } }
      coreC(Math.max(1,(5*(1-arg))|0));
    } else {
      const S=spine.map(T), Tn=tend.map(T), SP=spray.map(T), full=S.concat(Tn).concat(SP);
      if(k==='strike'){ putC(edges(S.concat(Tn),1),BOLT); putC(full,WHITE); coreC(4); }
      else if(k==='glow'){ putC(edges(S.concat(Tn),1),BOLT); putC(full,BRIGHT); coreC(3); }
      else if(k==='tfade'){ putC(S,BOLT); putC(Tn.filter(()=>Math.random()<arg),BOLT); coreC(2); }
      else if(k==='fade'){ putC(full.filter(()=>Math.random()<arg),BOLT); }
    }
  }
  newStroke(); compose(SEQ[0]);
  return { buf, advance(now){
    if(!stepStart) stepStart=now;
    drawTheta = strokeAngle + (now*0.001)*ROT;                // continuous magical rotation
    const step=SEQ[idx];
    if(step[0]==='glow' && now-lastGen>=REFRESH){ tend=tendrils(spinePoly,opt); lastGen=now; }
    compose(step);
    if(now-stepStart>=step[2]*UNIT){ idx++; if(idx>=SEQ.length){ idx=0; }
      stepStart=now; if(SEQ[idx][0]==='strike') newStroke(); }
  } };
}

if(typeof document!=='undefined'){
  const strikes=OPTS.map(o=>{
    const cell=document.createElement('div'); cell.className='cell';
    const cvs=document.createElement('canvas'); cvs.width=GW; cvs.height=GH; cell.appendChild(cvs);
    const lab=document.createElement('div'); lab.className='lab'; lab.innerHTML=o.id+' · <b>'+o.name+'</b>'; cell.appendChild(lab);
    document.getElementById('row').appendChild(cell);
    const ctx=cvs.getContext('2d'); ctx.imageSmoothingEnabled=false;
    return {s:makeStrike(o), ctx};
  });
  function frame(ts){ for(const o of strikes){ o.s.advance(ts); o.ctx.putImageData(new ImageData(o.s.buf,GW,GH),0,0); } requestAnimationFrame(frame); }
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
