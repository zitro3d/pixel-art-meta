<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hover-Bike — Kitbashed Moto / Aero Engine | pixel-art-meta</title>
<style>
  :root{ --bg:#0d0b16; --panel:#171327; --ink:#cdd6e4; --accent:#5fe9f2; --amber:#ffe27a; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:
      radial-gradient(1200px 600px at 50% 0%, #1c1733 0%, var(--bg) 60%),
      var(--bg);
    color:var(--ink);
    font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    display:flex; flex-direction:column; align-items:center; gap:18px;
    padding:28px 16px 60px;
  }
  h1{font-size:18px;margin:0;letter-spacing:.5px;color:#fff}
  h1 small{display:block;font-weight:400;color:#8a93a8;letter-spacing:0;font-size:12px;margin-top:4px}
  .stage{
    background:
      radial-gradient(60% 38% at 50% 92%, rgba(95,233,242,.10), transparent 70%),
      linear-gradient(180deg,#120f22 0%, #0a0813 100%);
    border:1px solid #2a2440;
    border-radius:12px;
    padding:14px;
    box-shadow:0 24px 60px -24px #000, inset 0 0 0 1px #ffffff08;
  }
  canvas{display:block;image-rendering:pixelated;border-radius:6px}
  .row{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;max-width:980px;width:100%}
  .legend{
    background:var(--panel);border:1px solid #2a2440;border-radius:10px;
    padding:14px 16px;flex:1 1 300px;min-width:280px;
  }
  .legend h2{margin:0 0 8px;font-size:12px;color:var(--accent);letter-spacing:1px;text-transform:uppercase}
  .legend ol{margin:0;padding-left:18px}
  .legend li{margin:3px 0;color:#aab3c5}
  .legend b{color:#e9eef6}
  .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
  button{
    font:inherit;color:#0a0813;background:linear-gradient(180deg,#7ff0f8,#1f9fb0);
    border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:700;
    box-shadow:0 6px 16px -8px #5fe9f2;
  }
  button.ghost{background:#211b38;color:#cdd6e4;box-shadow:none;border:1px solid #34304f}
  button:active{transform:translateY(1px)}
  .tag{font-size:11px;color:#7c86a0}
</style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel" data-presets="react">
const { useRef, useEffect, useState } = React;

/* =====================================================================
   Logical pixel grid (light-vehicle class per the style guide: 160x84).
   Everything is authored at this resolution, then blitted with an
   integer multiplier and imageSmoothingEnabled = false.
   ===================================================================== */
const GW = 160, GH = 84, SCALE = 6;

/* ---- Hue-shifted material ramps (Rule 2) -------------------------------
   ramp = [specular-hot, highlight, base, shadow, deep-shadow].
   Shadows shift toward indigo/plum/rust; highlights toward cream/cyan/gold.
   No grayscale, no black — outlines are midnight-indigo / deep plum.      */
const MAT = {
  alum:   { ramp:['#ffffff','#e0eaf3','#9aa6b4','#586079','#363a59'], outline:'#211f3a', rim:'#6b7286' },
  steel:  { ramp:['#eaf4fc','#aebfcb','#5b6b7a','#384459','#21203b'], outline:'#16142b', rim:'#444f63' },
  yellow: { ramp:['#fff6c8','#ffe27a','#e7b62a','#9a6a18','#5e360f'], outline:'#371d09', rim:'#7a4a14' },
  teal:   { ramp:['#c6ffff','#5fe9f2','#1f9fb0','#155f73','#0e3a48'], outline:'#0a2731', rim:'#177082' },
  rubber: { ramp:['#7a6379','#5d4a5e','#3b2f3c','#241a28','#150e17'], outline:'#110a13', rim:'#2d2230' },
  copper: { ramp:['#ffd9a8','#ee9a52','#b5602e','#6e3315','#3f1c0c'], outline:'#2a1208', rim:'#7a4020' },
};

const SILHOUETTE_OUTLINE = '#120f24'; // chonky outer contour (Rule 1, never pure black)

/* ---- RGBA framebuffer ------------------------------------------------- */
const buf = new Uint8ClampedArray(GW * GH * 4);

function hexToRGB(h){
  return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
}
const _cache = {};
function rgb(h){ return _cache[h] || (_cache[h] = hexToRGB(h)); }

function setC(x,y,hex){
  x|=0; y|=0;
  if(x<0||y<0||x>=GW||y>=GH) return;
  const c = rgb(hex), i = (y*GW + x)*4;
  buf[i]=c[0]; buf[i+1]=c[1]; buf[i+2]=c[2]; buf[i+3]=255;
}
const clamp = (v,a,b)=>v<a?a:v>b?b:v;

/* Pick a ramp band from a 0..1 t (0 = top/lit, 1 = bottom/shadow). */
function shade(mat, t){
  const r = mat.ramp;
  if(t < 0.07) return r[0];
  if(t < 0.22) return r[1];
  if(t < 0.56) return r[2];
  if(t < 0.80) return r[3];
  return r[4];
}

/* ---------------------------------------------------------------------- */
/*  PRIMITIVES                                                            */
/* ---------------------------------------------------------------------- */

// Rounded rect with vertical hue-shift, forward-edge specular, manual-AA corners.
function roundRect(x0,y0,x1,y1,r,mat,opt={}){
  const H = Math.max(1, y1-y0);
  let prevInset = null;
  for(let y=y0;y<=y1;y++){
    let inset = 0;
    if(y < y0+r){ const dy=(y0+r)-y; inset = Math.round(r - Math.sqrt(Math.max(0,r*r-dy*dy))); }
    else if(y > y1-r){ const dy=y-(y1-r); inset = Math.round(r - Math.sqrt(Math.max(0,r*r-dy*dy))); }
    const xa = x0+inset, xb = x1-inset;
    const t = (y-y0)/H;
    for(let x=xa;x<=xb;x++){
      let col = shade(mat, t);
      if(x===xa) col = shade(mat, Math.min(1, t+0.22));            // shadow side (rear/left)
      else if(x===xb && !opt.noFront) col = shade(mat, Math.max(0, t-0.30)); // forward specular edge
      setC(x,y,col);
    }
    // Specular inset highlight just inside the top edge (Rule: stamped metal).
    if(y===y0+ (r>0?1:0) && !opt.noTop){
      for(let x=xa+1;x<xb;x++) setC(x,y, mat.ramp[0]);
    }
    // Manual AA: soften corner stair-steps with a transitional rim pixel (Rule 3).
    if(prevInset!==null && Math.abs(inset-prevInset)>=1){
      const midL = shade(mat,0.9);
      setC(xa, y, midL); setC(xb, y, midL);
    }
    // Inner dark outline on the underside / rear (Rule 1).
    if(y===y1 && !opt.noBottom){ for(let x=xa;x<=xb;x++) setC(x,y, mat.outline); }
    prevInset = inset;
  }
}

// Shaded dome / disc with normal-based lighting + chonky rim (engine face, hubs).
function disc(cx,cy,r,mat,opt={}){
  const lx=0.55, ly=-0.78, lz=0.30;
  for(let y=-r-1;y<=r+1;y++){
    for(let x=-r-1;x<=r+1;x++){
      const d = Math.sqrt(x*x+y*y);
      if(d > r+0.5) continue;
      const nx=x/r, ny=y/r, nz=Math.sqrt(Math.max(0,1-nx*nx-ny*ny));
      const l = nx*lx + ny*ly + nz*lz;
      let col = shade(mat, clamp(0.52 - l*0.62, 0, 1));
      if(d > r-0.75) col = (l < 0.18) ? mat.outline : mat.rim;   // rim: dark on shadow side
      if(opt.flat) col = shade(mat, 0.4);
      setC(cx+x, cy+y, col);
    }
  }
}

// Horizontal cylinder body (engine nacelle / fuel tank barrel).
function cylinderH(x0,x1,cy,ry,mat,opt={}){
  const ridges = opt.ridges || [];
  for(let x=x0;x<=x1;x++){
    for(let y=-ry;y<=ry;y++){
      const ny = y/ry;
      let t = clamp(0.5 + ny*0.62, 0, 1);
      let col = shade(mat, t);
      if(Math.abs(ny+0.52) < 0.10) col = mat.ramp[1];   // top specular band
      if(Math.abs(ny+0.66) < 0.05) col = mat.ramp[0];   // hot glint
      if(x===x0 || x===x1) col = mat.outline;           // end caps / inner outline
      setC(x, cy+y, col);
    }
    // Cowl ridge greebles (Rule 4) — vertical seams across the nacelle.
    if(ridges.includes(x)){
      for(let y=-ry+1;y<=ry-1;y++) setC(x, cy+y, shade(mat, clamp(0.5+(y/ry)*0.62+0.18,0,1)));
      setC(x,cy-ry+1, mat.ramp[0]);
    }
  }
}

function lineC(x0,y0,x1,y1,hex,thick=1){
  const dx=Math.abs(x1-x0), dy=Math.abs(y1-y0), sx=x0<x1?1:-1, sy=y0<y1?1:-1;
  let err=dx-dy, x=x0, y=y0;
  while(true){
    for(let ox=0;ox<thick;ox++) for(let oy=0;oy<thick;oy++) setC(x+ox,y+oy,hex);
    if(x===x1 && y===y1) break;
    const e2=2*err;
    if(e2>-dy){ err-=dy; x+=sx; }
    if(e2<dx){ err+=dx; y+=sy; }
  }
}

// scatter rivets / vents / scratches (Rule 4)
function rivet(x,y,mat){ setC(x,y,mat.ramp[4]); setC(x,y-1,mat.ramp[0]); }
function vent(x,y,mat){ setC(x,y,mat.outline); setC(x+1,y,mat.outline); setC(x,y-1,mat.ramp[1]); }

/* ---------------------------------------------------------------------- */
/*  COMPOSE THE HOVER-BIKE  (z-layered, rear -> front, Rule 1)            */
/* ---------------------------------------------------------------------- */
function composeBike(){
  buf.fill(0);

  /* -- L0: ground reaction shadow ------------------------------------- */
  for(let y=72;y<=78;y++) for(let x=22;x<=140;x++){
    const rx=(x-82)/60, ry=(y-75)/3.4;
    if(rx*rx+ry*ry<=1) setC(x,y, y<75? '#1a1330':'#120d22');
  }

  /* -- L1: REAR hover thruster pod (motorcycle swingarm reimagined) ---- */
  roundRect(28,48,52,60,4, MAT.steel);
  roundRect(33,58,47,66,2, MAT.steel,{noTop:true});        // downward nozzle housing
  for(let x=35;x<=45;x++){ setC(x,66,MAT.teal.ramp[2]); setC(x,67,MAT.teal.outline); } // nozzle lip
  disc(40,62,4, MAT.teal,{});                              // glowing throat
  setC(40,62,MAT.teal.ramp[0]); setC(39,62,MAT.teal.ramp[1]); setC(41,62,MAT.teal.ramp[1]);
  vent(31,52,MAT.steel); vent(31,55,MAT.steel); rivet(49,51,MAT.steel); rivet(49,57,MAT.steel);

  /* -- L2: chassis spine beam w/ exposed wiring (Rule 4) -------------- */
  roundRect(24,43,140,50,2, MAT.steel,{noTop:true});
  for(let x=58;x<=92;x+=1){                                 // sagging copper wiring loom
    const y = 50 + Math.round(4*Math.sin((x-58)/34*Math.PI));
    setC(x,y,MAT.copper.ramp[2]); setC(x,y-1,MAT.copper.ramp[1]); setC(x,y+1,MAT.copper.ramp[3]);
  }
  for(let x=30;x<=134;x+=11) vent(x,47,MAT.steel);
  lineC(26,49,138,49, MAT.steel.outline);                  // underside inner outline

  /* -- L3: SEAT + tail cowl (rubber saddle, teal tailfin) ------------- */
  roundRect(16,29,54,42,5, MAT.rubber);                    // saddle / rear cowl
  // stitched seat ribbing
  for(let x=22;x<=44;x+=4) lineC(x,31,x,38,MAT.rubber.ramp[0]);
  // tailfin kicking up (aircraft empennage cue)
  for(let y=20;y<=34;y++){
    const w = Math.round((y-20)*0.7)+3;
    for(let x=16;x<16+w;x++){
      const t = clamp(0.2+(x-16)/14,0,1);
      setC(x,y, shade(MAT.teal, t));
    }
    setC(16,y, MAT.teal.outline);
  }
  // warning chevron + red taillight on the fin
  for(let k=0;k<3;k++) lineC(18+k*3,33-k*0, 20+k*3,28, MAT.yellow.ramp[2]);
  disc(22,24,2, MAT.teal,{flat:true}); setC(22,24,'#ff5a3c'); setC(22,23,'#ffd9c0');

  /* -- L4: FUEL TANK (motorcycle teardrop, aircraft livery) ----------- */
  roundRect(50,27,94,44,7, MAT.alum);
  // yellow hazard side-panel with teal pinstripe
  for(let y=33;y<=41;y++){
    const t=(y-33)/8;
    for(let x=58;x<=86;x++) setC(x,y, shade(MAT.yellow, clamp(t+0.1,0,1)));
  }
  lineC(58,33,86,33, MAT.yellow.ramp[1]);
  lineC(58,38,86,38, MAT.teal.ramp[1]);
  // riveted seam + filler cap greeble
  for(let x=54;x<=90;x+=5) rivet(x,30,MAT.alum);
  disc(72,29,3, MAT.steel,{}); setC(72,28,MAT.steel.ramp[0]);
  // top specular sweep (stamped highlight)
  lineC(56,28,84,28, MAT.alum.ramp[0]);

  /* -- L5: AIRPLANE ENGINE NACELLE (the showpiece) -------------------- */
  cylinderH(90,138,40,15, MAT.alum, { ridges:[98,106,114,122,130] });
  // intake lip ring just before the face
  for(let y=-15;y<=15;y++){ if(Math.abs(y)<=15) setC(138, 40+y, MAT.steel.outline); }
  // big radial intake disc (front face)
  disc(140,40,15, MAT.steel,{});
  // dark intake well
  disc(140,40,12, MAT.rubber,{flat:true});
  // turbine fan blades (aircraft) — alternating lit/shadow for spin read
  for(let k=0;k<11;k++){
    const a = k*(Math.PI*2/11) - 0.5;
    const x2 = 140+Math.round(Math.cos(a)*11), y2 = 40+Math.round(Math.sin(a)*11);
    lineC(140+Math.round(Math.cos(a)*4),40+Math.round(Math.sin(a)*4), x2,y2,
          (k%2? MAT.alum.ramp[1]:MAT.alum.ramp[3]));
  }
  disc(140,40,4, MAT.copper,{});            // spinner hub
  disc(140,40,2, MAT.copper,{flat:true});
  setC(139,39,'#ffd9a8');                   // hub glint
  // cowl flap greebles + exhaust slit at rear of nacelle
  for(let y=-12;y<=12;y+=3) vent(92,40+y,MAT.alum);
  for(let x=94;x<=136;x+=8){ rivet(x,29,MAT.alum); rivet(x,51,MAT.alum); }

  /* -- L6: FRONT hover nozzle pod (under the engine) ------------------ */
  roundRect(112,52,134,60,3, MAT.steel);
  roundRect(116,58,130,67,2, MAT.steel,{noTop:true});
  for(let x=117;x<=129;x++){ setC(x,67,MAT.teal.ramp[2]); setC(x,68,MAT.teal.outline); }
  disc(123,63,4, MAT.teal,{});
  setC(123,63,MAT.teal.ramp[0]); setC(122,63,MAT.teal.ramp[1]); setC(124,63,MAT.teal.ramp[1]);
  // strut tying pod to frame
  lineC(120,52,116,50, MAT.steel.ramp[3],1);
  lineC(128,52,132,50, MAT.steel.ramp[3],1);

  /* -- L7: handlebars / clip-ons + control cables (foreground) -------- */
  lineC(96,40,96,23, MAT.steel.ramp[2],2);   // riser
  lineC(96,24,106,21, MAT.steel.ramp[2],2);  // right clip-on
  lineC(96,25,86,22, MAT.steel.ramp[2],2);   // left clip-on
  disc(106,21,2, MAT.rubber,{flat:true});    // grips
  disc(86,22,2, MAT.rubber,{flat:true});
  lineC(96,40,100,30, MAT.copper.ramp[2]);   // dangling throttle cable
  lineC(96,40,92,30, MAT.copper.ramp[3]);
  // hairline scratches on the tank (surface wear)
  lineC(64,31,70,32, MAT.alum.ramp[1]); lineC(78,30,82,31, MAT.alum.ramp[0]);

  /* -- L8: chonky outer contour pass (Rule 1) ------------------------- */
  outlineSilhouette();
}

// Add a 1px midnight-indigo contour around the whole silhouette.
function outlineSilhouette(){
  const alpha = new Uint8Array(GW*GH);
  for(let i=0;i<GW*GH;i++) alpha[i] = buf[i*4+3];
  const oc = rgb(SILHOUETTE_OUTLINE);
  for(let y=0;y<GH;y++) for(let x=0;x<GW;x++){
    if(alpha[y*GW+x]) continue;
    const n = (alpha[(y-1>=0?y-1:0)*GW+x] || alpha[(y+1<GH?y+1:y)*GW+x] ||
               alpha[y*GW+(x-1>=0?x-1:0)] || alpha[y*GW+(x+1<GW?x+1:x)]);
    if(n){ const i=(y*GW+x)*4; buf[i]=oc[0]; buf[i+1]=oc[1]; buf[i+2]=oc[2]; buf[i+3]=255; }
  }
}

/* ---------------------------------------------------------------------- */
/*  PARTICLE EXHAUST (Rule 5): neon cores collapsing into ember trails    */
/* ---------------------------------------------------------------------- */
const NOZZLES = [ {x:40, y:67}, {x:123, y:68} ];
function makeParticle(n){
  return {
    x: n.x + (Math.random()*3-1.5),
    y: n.y + Math.random()*1.5,
    vx: (Math.random()-0.5)*0.5,
    vy: 1.0 + Math.random()*1.1,
    age: 0,
    max: 14 + (Math.random()*12|0),
  };
}
// geometric decay ramp for embers
const EMBER = ['#d8ffff','#6ffcff','#5fe9f2','#ffd24a','#ff8a3c','#ff5a3c'];
function emberColor(life){
  const idx = Math.min(EMBER.length-1, Math.floor((1-life)*EMBER.length));
  return EMBER[idx];
}

function App(){
  const cvs = useRef(null);
  const [running, setRunning] = useState(true);
  const [glow, setGlow] = useState(true);
  const runRef = useRef(running), glowRef = useRef(glow);
  runRef.current = running; glowRef.current = glow;

  useEffect(()=>{
    composeBike();

    // bake static bike to its own offscreen logical canvas
    const off = document.createElement('canvas'); off.width=GW; off.height=GH;
    const octx = off.getContext('2d');
    octx.putImageData(new ImageData(new Uint8ClampedArray(buf), GW, GH), 0, 0);

    const frame = document.createElement('canvas'); frame.width=GW; frame.height=GH;
    const fctx = frame.getContext('2d');

    const ctx = cvs.current.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    let particles = [];
    let raf, t = 0;

    const loop = ()=>{
      t++;
      fctx.clearRect(0,0,GW,GH);
      fctx.drawImage(off,0,0);

      if(runRef.current){
        // spawn
        for(const n of NOZZLES){
          const count = 2 + (Math.random()*2|0);
          for(let i=0;i<count;i++) particles.push(makeParticle(n));
        }
        // flickering glow plume at each nozzle mouth
        if(glowRef.current){
          for(const n of NOZZLES){
            const fl = 0.6 + Math.random()*0.4;
            fctx.fillStyle = 'rgba(95,233,242,'+(0.5*fl)+')';
            fctx.fillRect(n.x-2, n.y, 5, 2);
            fctx.fillStyle = 'rgba(216,255,255,'+(0.8*fl)+')';
            fctx.fillRect(n.x-1, n.y, 3, 1);
          }
        }
      }

      // update + draw particles
      const next = [];
      for(const p of particles){
        p.age++;
        p.x += p.vx; p.y += p.vy; p.vy += 0.05;
        if(p.y > 73){ p.y = 73; p.vy *= -0.25; p.vx *= 1.7; p.age += 2; } // splay on ground
        const life = 1 - p.age/p.max;
        if(life <= 0) continue;
        // geometric decay: size steps down 3 -> 2 -> 1 px
        const size = life>0.66 ? 3 : life>0.33 ? 2 : 1;
        fctx.fillStyle = emberColor(life);
        fctx.fillRect((p.x-(size>1?1:0))|0, (p.y-(size>1?1:0))|0, size, size);
        if(life>0.8){ fctx.fillStyle='#ffffff'; fctx.fillRect(p.x|0,p.y|0,1,1); }
        next.push(p);
      }
      particles = next.length>600 ? next.slice(next.length-600) : next;

      ctx.clearRect(0,0,GW*SCALE,GH*SCALE);
      ctx.drawImage(frame, 0,0, GW,GH, 0,0, GW*SCALE, GH*SCALE);
      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);
    return ()=>cancelAnimationFrame(raf);
  },[]);

  return (
    <React.Fragment>
      <h1>HOVER-BIKE · “KESTREL”
        <small>Kitbash — 90s sportbike chassis + radial aircraft engine · 160×84 logical grid · integer-scaled, no smoothing</small>
      </h1>

      <div className="stage">
        <canvas ref={cvs} width={GW*SCALE} height={GH*SCALE} />
      </div>

      <div className="controls">
        <button onClick={()=>setRunning(r=>!r)}>{running? 'Pause thrusters':'Resume thrusters'}</button>
        <button className="ghost" onClick={()=>setGlow(g=>!g)}>{glow? 'Glow plume: ON':'Glow plume: OFF'}</button>
        <span className="tag">react + html5 canvas · pixel-art-meta</span>
      </div>

      <div className="row">
        <div className="legend">
          <h2>Parts kitbashed in</h2>
          <ol>
            <li><b>Radial aero engine</b> — front nacelle, turbine fan + spinner hub, cowl flaps.</li>
            <li><b>Sportbike teardrop tank</b> — aircraft hazard livery + filler cap.</li>
            <li><b>Moto saddle &amp; tail cowl</b> — re-skinned as an empennage tailfin.</li>
            <li><b>Twin hover nozzles</b> — swingarm/exhaust reimagined as downward jets.</li>
            <li><b>Clip-on bars</b> + exposed copper wiring loom &amp; control cables.</li>
          </ol>
        </div>
        <div className="legend">
          <h2>Framework rules applied</h2>
          <ol>
            <li><b>Z-layered depth</b> — 9 passes, rear→front, no flat silhouette.</li>
            <li><b>Hue-shifted shading</b> — indigo/plum/rust shadows, cream/gold/cyan highlights.</li>
            <li><b>Manual AA</b> — transitional pixels on disc &amp; corner diagonals.</li>
            <li><b>Greebles</b> — rivets, dual-px vents, scratches, exposed wiring.</li>
            <li><b>Particle exhaust</b> — neon cores decaying into trailing 1px embers.</li>
          </ol>
        </div>
      </div>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
