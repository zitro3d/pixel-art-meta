<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Electric Layers — Cinematic Green FX Library | pixel-art-meta</title>
<style>
  html,body{margin:0;min-height:100%;background:#050705;color:#8fcf9a;font:13px ui-monospace,Menlo,Consolas,monospace}
  h1{text-align:center;color:#c9ffd6;font-size:15px;margin:18px 0 2px}
  p.sub{text-align:center;color:#5f8f68;margin:0 0 16px}
  .row{display:flex;gap:14px;justify-content:center;align-items:flex-end;flex-wrap:wrap;padding:6px 14px 30px}
  .cell{display:flex;flex-direction:column;align-items:center;gap:7px}
  canvas{ image-rendering:pixelated; image-rendering:crisp-edges; height:52vh; width:auto; background:#000; border-radius:4px; }
  .lab{color:#9fffb0;letter-spacing:1px}
  .lab b{color:#fff}
</style>
</head>
<body>
  <h1>ELECTRIC LAYERS — CINEMATIC GREEN FX</h1>
  <p class="sub">coherent flowing arcs (not sporadic) · loop seamlessly · render on black → composite with SCREEN / ADD over your subject</p>
  <div class="row" id="row"></div>

<script>
/* ELECTRIC LAYERS — a library of cinematic green electricity elements.
   Bolts are COHERENT: their shape is driven by smooth animated harmonics so
   they writhe/flow gracefully (not re-randomized per frame), with a travelling
   energy pulse. Additive light -> green-weighted tonemap. Designed to be laid
   over a person with a SCREEN or ADD blend (rendered on black). */
const TW=140, TH=170, LOOP=3.0, TAU=Math.PI*2;
const acc=new Float32Array(TW*TH*3);
const GLOW=[.26,1,.40], CORE=[.72,1,.80], DEEP=[.07,.55,.20], ACID=[.72,1,.20];

function addpx(x,y,r,g,b){ x|=0;y|=0; if(x<0||y<0||x>=TW||y>=TH)return; const i=(y*TW+x)*3; acc[i]+=r;acc[i+1]+=g;acc[i+2]+=b; }
function glow(cx,cy,rad,c,inten){ const x0=Math.max(0,(cx-rad)|0),x1=Math.min(TW-1,(cx+rad)|0),y0=Math.max(0,(cy-rad)|0),y1=Math.min(TH-1,(cy+rad)|0);
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){ const dx=x-cx,dy=y-cy,d=Math.sqrt(dx*dx+dy*dy); if(d>rad)continue; let f=1-d/rad; f*=f; addpx(x,y,c[0]*f*inten,c[1]*f*inten,c[2]*f*inten); } }

// wrap distance on [0,1) for the travelling pulse
function wdist(a,b){ let d=Math.abs(a-b); return Math.min(d,1-d); }

/* a coherent, smoothly-flowing bolt from A->B.
   ph = TAU*t/LOOP (loop phase). seed varies the waveform. */
function flowBolt(ax,ay,bx,by, amp, ph, seed, inten, segs, thick){
  segs=segs||26; thick=thick||1;
  const px=-(by-ay), py=(bx-ax), pl=Math.hypot(px,py)||1;
  const pts=[];
  for(let i=0;i<=segs;i++){ const u=i/segs, env=Math.sin(u*Math.PI);
    const off=amp*env*( Math.sin(u*4.5 + 1*ph + seed)*0.58
                      + Math.sin(u*9.5 - 2*ph + seed*1.7)*0.28
                      + Math.sin(u*17.0 + 3*ph + seed*2.6)*0.14 );
    pts.push([ ax+(bx-ax)*u + px/pl*off, ay+(by-ay)*u + py/pl*off ]);
  }
  const center=(ph/TAU)%1;
  for(let i=0;i<pts.length-1;i++){ const a=pts[i],b=pts[i+1],L=Math.hypot(b[0]-a[0],b[1]-a[1]),S=Math.ceil(L)+1;
    for(let s=0;s<=S;s++){ const k=s/S, u=(i+k)/segs, x=a[0]+(b[0]-a[0])*k, y=a[1]+(b[1]-a[1])*k;
      const pulse=Math.exp(-Math.pow(wdist(u,center),2)/(2*0.10*0.10));   // travelling energy surge
      const inn=inten*(0.65+0.7*pulse);
      glow(x,y, 2.4+thick, GLOW, inn*0.55);
      if(thick>1) glow(x,y,1.4,GLOW,inn*0.7);
      addpx(x,y, CORE[0]*inn, CORE[1]*inn, CORE[2]*inn);                   // hot core
    } }
  return pts;
}
function branch(pts, frac, len, ang, amp, ph, seed, inten){
  const i=Math.max(1,Math.min(pts.length-2,(frac*pts.length)|0)), a=pts[i];
  flowBolt(a[0],a[1], a[0]+Math.cos(ang)*len, a[1]+Math.sin(ang)*len, amp, ph, seed, inten, 14);
}

/* ---- the elements ------------------------------------------------------ */
const CX=TW/2, CY=TH/2;
function draw(kind, t){
  acc.fill(0);
  const ph=TAU*(t/LOOP);
  if(kind==='tendril'){
    const ax=CX+Math.sin(ph)*10, bx=CX-Math.sin(ph*0.5)*10;
    const p=flowBolt(ax,8, bx,TH-8, 20, ph, 0.4, 1.0, 30, 2);
    branch(p,0.35, 26, -0.6+Math.sin(ph)*0.4, 8, ph, 2.1, 0.7);
    branch(p,0.66, 30, 2.6+Math.cos(ph)*0.4, 9, ph, 3.3, 0.7);
    glow(ax,8,4,ACID,0.5); glow(bx,TH-8,4,ACID,0.5);
  } else if(kind==='sweep'){
    const s=Math.sin(ph);
    flowBolt(TW*(0.5+0.42*s),6, TW*(0.5-0.42*s),TH-6, 22, ph, 1.1, 1.0, 30, 2);
  } else if(kind==='tesla'){
    const A=[16,CY], B=[TW-16,CY];
    glow(A[0],A[1],6,ACID,0.9); glow(B[0],B[1],6,ACID,0.9);
    const p=flowBolt(A[0],A[1],B[0],B[1], 26, ph, 0.7, 1.1, 34, 2);
    branch(p,0.5, 22, -1.3+Math.sin(ph*1.3)*0.5, 10, ph, 4.0, 0.6);
    branch(p,0.4, 18, 1.4+Math.cos(ph*1.1)*0.5, 9, ph, 5.2, 0.6);
  } else if(kind==='orbit'){
    const R=52;
    for(let k=0;k<3;k++){ const a0=ph*1.0 + k*TAU/3, a1=a0+2.0;
      const ax=CX+Math.cos(a0)*R, ay=CY+Math.sin(a0)*R*1.05, bx=CX+Math.cos(a1)*R, by=CY+Math.sin(a1)*R*1.05;
      flowBolt(ax,ay,bx,by, 12, ph+k, 0.3+k, 0.85, 22, 1); }
    glow(CX,CY, 14, GLOW, 0.5+0.2*Math.sin(ph*2));
  } else if(kind==='twin'){
    flowBolt(CX-16,6, CX+16,TH-6, 18, ph, 0.5, 0.95, 28, 2);
    flowBolt(CX+16,6, CX-16,TH-6, 18, ph+Math.PI, 2.0, 0.95, 28, 2);
  } else if(kind==='cascade'){
    for(let k=0;k<4;k++){ const x=24+k*(TW-48)/3, dph=ph+k*0.9;
      const p=flowBolt(x+Math.sin(dph)*8, 6, x+Math.sin(dph*0.7)*14, TH-6, 12, dph, 0.4+k*1.3, 0.8, 24, 1);
      if(k%2===0) branch(p,0.6, 18, 1.9, 7, dph, 6+k, 0.55); }
  }
  // compose: green-weighted tonemap + alpha from brightness (transparent)
  const img=OUT, N=TW*TH;
  for(let i=0;i<N;i++){ let r=acc[i*3],g=acc[i*3+1],b=acc[i*3+2];
    r=1-Math.exp(-r*0.85); g=1-Math.exp(-g*1.8); b=1-Math.exp(-b*0.85);
    const a=Math.min(1,Math.max(r,g,b)*2.1);
    img[i*4]=r*255; img[i*4+1]=g*255; img[i*4+2]=b*255; img[i*4+3]=a*255; }
  return img;
}
let OUT=new Uint8ClampedArray(TW*TH*4);

const ELS=[['tendril','Tendril'],['sweep','Sweep'],['tesla','Tesla'],['orbit','Orbit'],['twin','Twin'],['cascade','Cascade']];

if(typeof document!=='undefined'){
  const strikes=ELS.map(([kind,name],idx)=>{
    const cell=document.createElement('div'); cell.className='cell';
    const cvs=document.createElement('canvas'); cvs.width=TW; cvs.height=TH; cell.appendChild(cvs);
    const lab=document.createElement('div'); lab.className='lab'; lab.innerHTML='<b>'+name+'</b>'; cell.appendChild(lab);
    document.getElementById('row').appendChild(cell);
    const ctx=cvs.getContext('2d'); ctx.imageSmoothingEnabled=false;
    return {kind, ctx, off:idx*0.5};
  });
  let t0=0;
  function tick(ts){ if(!t0)t0=ts; const t=(ts-t0)*0.001;
    for(const s of strikes){ s.ctx.clearRect(0,0,TW,TH); s.ctx.putImageData(new ImageData(draw(s.kind, t+s.off),TW,TH),0,0); }
    requestAnimationFrame(tick); }
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
