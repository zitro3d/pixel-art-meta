<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cosmic Summoning — Structured Static Frame | pixel-art-meta</title>
<style>
  html,body{margin:0;background:#06040c}
  #wrap{display:block;width:100%}
  canvas{
    display:block;
    image-rendering:pixelated; image-rendering:crisp-edges;
    width:100%; height:auto;        /* scale up, keep crisp */
  }
</style>
</head>
<body>
  <div id="wrap"><canvas id="screen"></canvas></div>

<script>
/* ======================================================================
   COSMIC SUMMONING  — deterministic, geometric static frame.
   480x270 base, drawn with direct integer pixel ops into one palette of
   flat retro colors. No noise, no additive HDR, no dithering — every
   shape is placed by fixed layout math so the composition is predictable.
   ====================================================================== */
const IW = 480, IH = 270;
const img = new Uint8ClampedArray(IW*IH*4);

/* ---- flat retro palette ---------------------------------------------- */
const C = {
  bg:      [10, 7, 18],
  black:   [0, 0, 0],
  white:   [255,255,255],
  cream:   [255,244,180],
  yellow:  [255,221,0],     // #FFD700
  orangeL: [255,138,24],
  orange:  [255,69,0],      // #FF4500
  orangeD: [176,58,12],
  violetL: [199,141,255],
  purple:  [138,43,226],    // #8A2BE2
  indigo:  [75,0,130],      // #4B0082
  indigoD: [40,8,74],
  rock:    [110,78,44],
  rockL:   [150,112,64],
  rockD:   [60,40,22],
};

/* ---- primitives (all integer, hard-edged) ----------------------------- */
function px(x,y,c){ x=Math.round(x); y=Math.round(y); if(x<0||y<0||x>=IW||y>=IH) return;
  const i=(y*IW+x)*4; img[i]=c[0]; img[i+1]=c[1]; img[i+2]=c[2]; img[i+3]=255; }
function disc(cx,cy,r,c){ cx=Math.round(cx); cy=Math.round(cy);
  for(let y=-r;y<=r;y++) for(let x=-r;x<=r;x++) if(x*x+y*y<=r*r) px(cx+x,cy+y,c); }
function ringBand(cx,cy,rOut,rIn,c){ cx=Math.round(cx); cy=Math.round(cy);
  for(let y=-rOut;y<=rOut;y++) for(let x=-rOut;x<=rOut;x++){ const d=x*x+y*y;
    if(d<=rOut*rOut && d>=rIn*rIn) px(cx+x,cy+y,c); } }
function capsule(x0,y0,x1,y1,r,c){ const L=Math.hypot(x1-x0,y1-y0), N=Math.ceil(L);
  for(let s=0;s<=N;s++){ const k=s/N; disc(x0+(x1-x0)*k, y0+(y1-y0)*k, r, c); } }
function trap(yt,yb,xtl,xtr,xbl,xbr,c){ for(let y=yt;y<=yb;y++){ const t=(y-yt)/(yb-yt);
  const xl=Math.round(xtl+(xbl-xtl)*t), xr=Math.round(xtr+(xbr-xtr)*t);
  for(let x=xl;x<=xr;x++) px(x,y,c); } }
// solid diagonal stream with a bright centre line and indigo edges
function stream(ax,ay,bx,by,halfW){
  const x0=Math.min(ax,bx)-halfW, x1=Math.max(ax,bx)+halfW;
  const y0=Math.min(ay,by)-halfW, y1=Math.max(ay,by)+halfW;
  const vx=bx-ax, vy=by-ay, L2=vx*vx+vy*vy;
  for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){
    let t=((x-ax)*vx+(y-ay)*vy)/L2; t=t<0?0:t>1?1:t;
    const px_=ax+vx*t, py_=ay+vy*t, d=Math.hypot(x-px_,y-py_);
    if(d>halfW) continue;
    let c;
    if(d>=halfW-2) c=C.indigoD;
    else if(d>=halfW-5) c=C.indigo;
    else if(d<=2.5) c=C.violetL;
    else c=C.purple;
    px(x,y,c);
  }
}
// tight deterministic zig-zag beam, 3-4px thick, core + border
function zigzag(ax,ay,bx,by,segs,amp,coreCol,edgeCol){
  const len=Math.hypot(bx-ax,by-ay), nx=-(by-ay)/len, ny=(bx-ax)/len;
  const pts=[];
  for(let i=0;i<=segs;i++){ const t=i/segs;
    const env=Math.sin(t*Math.PI);                       // no offset at the endpoints
    const off=(i%2? amp:-amp)*env;
    pts.push([ ax+(bx-ax)*t + nx*off, ay+(by-ay)*t + ny*off ]); }
  for(let pass=0; pass<2; pass++){
    const r = pass===0? 2 : 1;                            // border pass then core pass
    const col = pass===0? edgeCol : coreCol;
    for(let i=0;i<pts.length-1;i++){
      const a=pts[i], b=pts[i+1], L=Math.hypot(b[0]-a[0],b[1]-a[1]), N=Math.ceil(L);
      for(let s=0;s<=N;s++){ const k=s/N; disc(a[0]+(b[0]-a[0])*k, a[1]+(b[1]-a[1])*k, r, col); }
    }
  }
}

/* ====================================================================== */
function buildScene(){
  // background
  for(let i=0;i<IW*IH;i++){ const j=i*4; img[j]=C.bg[0]; img[j+1]=C.bg[1]; img[j+2]=C.bg[2]; img[j+3]=255; }

  /* -- (a) vertical lightning pillars behind the figure ---------------- */
  const pillarX=[205,222,240,258,275];
  for(let p=0;p<pillarX.length;p++){
    const baseX=pillarX[p];
    for(let y=8;y<=150;y++){
      const cx=baseX + Math.round(1.4*Math.sin((y+p*17)*0.5));
      px(cx-2,y,C.orange); px(cx+2,y,C.orange);            // thin orange border
      px(cx-1,y,C.yellow); px(cx+1,y,C.yellow);            // yellow body
      px(cx,  y,C.cream);                                  // bright core
    }
  }

  /* -- (b) lower ground waves — solid diagonal streams ----------------- */
  stream(0,270, 200,190, 11);     // bottom-left  -> left armpit
  stream(480,270, 280,190, 11);   // bottom-right -> right armpit

  /* -- (c) LEFT orb: concentric crescent sun --------------------------- */
  // banded sun (outer dark-orange -> orange -> yellow -> white core)
  disc(130,60, 30, C.orangeD);
  disc(130,60, 25, C.orange);
  disc(130,60, 19, C.yellow);
  disc(130,60, 10, C.cream);
  disc(130,60, 5,  C.white);
  // carve a crescent by knocking out an offset disc with the background
  disc(143,49, 24, C.bg);

  /* -- (d) RIGHT orb: Archimedean spiral galaxy ------------------------ */
  const gx=350, gy=60, maxR=30, turns=2.6, b=maxR/(turns*Math.PI*2);
  // indigo disc backing so the arms read as a galaxy body
  disc(gx,gy, maxR, C.indigoD);
  for(let arm=0; arm<2; arm++){
    const a0=arm*Math.PI;
    for(let th=0; th<turns*Math.PI*2; th+=0.06){
      const r=b*th, a=th+a0, x=gx+Math.cos(a)*r, y=gy+Math.sin(a)*r;
      const f=th/(turns*Math.PI*2);
      let col, rad;
      if(f<0.20){ col=C.yellow; rad=3; }
      else if(f<0.30){ col=C.orangeL; rad=3; }
      else { col = (f<0.65? C.purple : C.indigo); rad = (f<0.65?3:2); }
      disc(x,y, rad, col);
    }
  }
  disc(gx,gy, 7, C.yellow);        // solid bright core
  disc(gx,gy, 4, C.cream);
  disc(gx,gy, 2, C.white);

  /* -- (e) hand-to-orb energy beams ------------------------------------ */
  zigzag(160,120, 130,60, 7, 8, C.cream,  C.orange);   // left: golden zig-zag
  zigzag(320,120, 350,60, 7, 8, C.white,  C.purple);   // right: violet zig-zag

  /* -- (f) floating debris rocks (8) ----------------------------------- */
  const rocks=[[64,236,5],[112,250,4],[152,226,4],[206,252,3],[300,228,4],[342,250,5],[388,232,4],[428,252,3]];
  for(const [rx,ry,rr] of rocks){
    disc(rx,ry, rr, C.rockD);
    disc(rx,ry, rr-1, C.rock);
    disc(rx-1,ry-1, Math.max(1,rr-3), C.rockL);          // simple top-left highlight
  }

  /* -- (g) CENTRAL SILHOUETTE (solid black, on top) -------------------- */
  trap(168,270, 214,266, 224,256, C.black);              // torso + legs block
  disc(215,170,13,C.black); disc(265,170,13,C.black);    // shoulders
  capsule(240,168,240,156,7,C.black);                    // neck
  disc(240,150,16,C.black);                              // head
  capsule(218,168, 160,120, 8, C.black);                 // left arm  -> hand (160,120)
  capsule(262,168, 320,120, 8, C.black);                 // right arm -> hand (320,120)
  disc(160,120,8,C.black); disc(320,120,8,C.black);      // fists
}

/* ---- DOM bootstrap ---------------------------------------------------- */
if(typeof document!=='undefined'){
  const cvs=document.getElementById('screen');
  cvs.width=IW; cvs.height=IH;
  const ctx=cvs.getContext('2d');
  ctx.imageSmoothingEnabled=false;
  buildScene();
  ctx.putImageData(new ImageData(img, IW, IH), 0, 0);
}
</script>
</body>
</html>
