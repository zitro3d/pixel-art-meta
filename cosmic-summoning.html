const IW=300, IH=176, N=IW*IH;
const cvs=document.getElementById("screen"); cvs.width=IW; cvs.height=IH;
const ctx=cvs.getContext("2d"); ctx.imageSmoothingEnabled=false;

// tunables
const GROW=4.0, FEATHER=9.0, TIPW=10.0, BW=12.0, SWEEP=70.0;

const im=new Image(); im.onload=init; im.src=SRC;
let base, out, lum, phase, purp, roff, maxD=1, t0=0;

function init(){
  const off=document.createElement("canvas"); off.width=IW; off.height=IH;
  const octx=off.getContext("2d"); octx.drawImage(im,0,0,IW,IH);
  base=octx.getImageData(0,0,IW,IH); out=ctx.createImageData(IW,IH);
  lum=new Float32Array(N); phase=new Float32Array(N); purp=new Uint8Array(N); roff=new Float32Array(N);
  const emW=[[60,40],[238,38],[150,IH-1]], emP=[[0,IH-1],[IW-1,IH-1]];
  const d=base.data;
  for(let y=0;y<IH;y++) for(let x=0;x<IW;x++){
    const i=y*IW+x, r=d[i*4],g=d[i*4+1],b=d[i*4+2];
    lum[i]=Math.max(r,g,b);
    const isP=b>r+6; purp[i]=isP?1:0;
    const em=isP?emP:emW; let md=1e9;
    for(let k=0;k<em.length;k++){ const dd=Math.hypot(x-em[k][0],y-em[k][1]); if(dd<md) md=dd; }
    phase[i]=md; roff[i]=((x*131+y*57)%1000)/1000;
    if(lum[i]>30 && md<900 && md>maxD) maxD=md;
  }
  requestAnimationFrame(loop);
}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

function loop(ts){
  if(!t0) t0=ts; const t=(ts-t0)*0.001;
  const d=base.data, o=out.data;
  const kW=2*Math.PI/42, kP=2*Math.PI/55;
  const grow=clamp(t/GROW,0,1), ease=1-(1-grow)*(1-grow);
  const Rfront=ease*maxD*1.05, growing=t<GROW;
  const sweepFront=(t*SWEEP)%(maxD+60);
  for(let i=0;i<N;i++){
    let r=d[i*4], g=d[i*4+1], b=d[i*4+2];
    const L=lum[i];
    if(L>30){
      const isP=purp[i], k=isP?kP:kW, sp=isP?2.2:3.0, ph=phase[i];
      const reveal=clamp((Rfront-ph)/FEATHER,0,1);
      const crest=Math.max(0,Math.sin(ph*k - t*sp)), surge=1+0.5*crest*crest;
      const flick=0.9+0.2*(Math.sin(t*37+roff[i]*100)*0.5+0.5);
      const mul=reveal*surge*flick;
      r*=mul; g*=mul; b*=mul;
      const band=Math.exp(-((ph-sweepFront)*(ph-sweepFront))/(2*BW*BW))*reveal;
      const tip=growing?clamp(1-Math.abs(Rfront-ph)/TIPW,0,1):0;
      const add=255*(0.7*band+0.95*tip);
      r+=add; g+=add*0.85; b+=add*0.6;
      if(r>255)r=255; if(g>255)g=255; if(b>255)b=255;
    }
    o[i*4]=r; o[i*4+1]=g; o[i*4+2]=b; o[i*4+3]=255;
  }
  ctx.putImageData(out,0,0);
  requestAnimationFrame(loop);
}
