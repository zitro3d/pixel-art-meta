<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fireflies — Glow Motes | pixel-art-meta</title>
<style>
  html,body{margin:0;height:100%;background:#000;display:flex;align-items:center;justify-content:center;
    font:12px ui-monospace,Menlo,Consolas,monospace;color:#8a7;}
  .stage{display:flex;flex-direction:column;align-items:center;gap:12px}
  canvas{ image-rendering:pixelated; image-rendering:crisp-edges;
    width:min(94vw,1000px); height:auto; background:#000; border-radius:6px;
    box-shadow:0 0 60px #1a1402; }
  .cap{letter-spacing:3px;font-size:11px;opacity:.6;text-transform:uppercase}
</style>
</head>
<body>
  <div class="stage">
    <canvas id="c" width="224" height="148"></canvas>
    <div class="cap">fireflies · slow drifting glow motes · transparent</div>
  </div>

<script>
/* Warm firefly glow-motes drifting slowly on gentle Lissajous paths, each
   softly pulsing on its own rhythm (fading in and out like a firefly) with a
   soft bloom and a white-hot core. Varied depth sizes for parallax. Additive
   max-blended glow -> soft tonemap. Seamless loop, transparent, on black.
   224x148 virtual canvas, integer-scaled, no smoothing. */
const W=224, H=148;
const FR=new Float32Array(W*H), FG=new Float32Array(W*H), FB=new Float32Array(W*H), FA=new Float32Array(W*H);
const buf=new Uint8ClampedArray(W*H*4);
function hsv(h,s,v){ h=(h%1+1)%1; const i=Math.floor(h*6), f=h*6-i,
  p=v*(1-s), q=v*(1-f*s), t=v*(1-(1-f)*s); let r,g,b;
  switch(i%6){ case 0:r=v;g=t;b=p;break; case 1:r=q;g=v;b=p;break; case 2:r=p;g=v;b=t;break;
    case 3:r=p;g=q;b=v;break; case 4:r=t;g=p;b=v;break; default:r=v;g=p;b=q; }
  return [r*255,g*255,b*255]; }
function mulberry(a){ return function(){ a|=0;a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function gmax(x,y,r,g,b,a){ x|=0;y|=0; if(x<0||y<0||x>=W||y>=H)return; const i=y*W+x;
  if(r>FR[i])FR[i]=r; if(g>FG[i])FG[i]=g; if(b>FB[i])FB[i]=b; if(a>FA[i])FA[i]=a; }

/* warm firefly field ----------------------------------------------------- */
const MOTES=[]; (function(){ const R=mulberry(2027); const n=30;
  for(let i=0;i<n;i++){
    const depth=R()*R();                                  // 0 far .. 1 near
    MOTES.push({
      x0: 8+R()*(W-16), y0: 10+R()*(H-20),
      ax: 8+R()*20, ay: 6+R()*16,                         // slow wander amplitudes
      kx: 1+(R()*2|0), ky: 1+(R()*2|0),                   // integer freqs -> seamless
      phx: R(), phy: R(), kx2:2+(R()*2|0), phx2:R(), ax2:3+R()*8,
      glow: 3 + depth*7,                                  // glow radius (near = bigger)
      bright: 0.45 + depth*0.55,                          // near = brighter
      hue: 0.09 + R()*0.09 + (R()<0.18? 0.07:0),          // warm amber/gold, a few yellow-green
      blinkK: 1+(R()*3|0), blph: R(), sharp: 1.6+R()*2.2, // pulse rhythm
      base: R()<0.45 ? 0.0 : 0.06+R()*0.16,               // some fully blink, some keep a faint glow
    });
  }
})();

function render(p){
  FR.fill(0);FG.fill(0);FB.fill(0);FA.fill(0);
  const TAU=2*Math.PI;
  for(const m of MOTES){
    const x = m.x0 + m.ax*Math.sin(TAU*(p*m.kx + m.phx)) + m.ax2*Math.sin(TAU*(p*m.kx2 + m.phx2));
    const y = m.y0 + m.ay*Math.sin(TAU*(p*m.ky + m.phy));
    const pulse = Math.pow(0.5+0.5*Math.sin(TAU*(p*m.blinkK + m.blph)), m.sharp);
    const b = (m.base + (1-m.base)*pulse) * m.bright;      // firefly glow (fades in/out)
    if(b<0.012) continue;
    const [wr,wg,wb]=hsv(m.hue,0.78,1.0);                  // warm body
    const [cr,cg,cb]=hsv(m.hue,0.12,1.0);                  // warm-white core
    const r=m.glow, s2=2*(r*0.55)*(r*0.55), bb=Math.ceil(r*2.4);
    for(let dy=-bb;dy<=bb;dy++) for(let dx=-bb;dx<=bb;dx++){
      const g=Math.exp(-(dx*dx+dy*dy)/s2); if(g<0.012) continue;
      const inten=g*b, core=g*g*g;                         // white-hot centre
      const R2=(wr*(1-core)+cr*core)*inten, G2=(wg*(1-core)+cg*core)*inten, B2=(wb*(1-core)+cb*core)*inten;
      gmax(x+dx, y+dy, R2,G2,B2, Math.min(1,inten*1.1));
    }
    if(b>0.7 && m.glow>6){ const [sr,sg,sb]=hsv(m.hue,0.1,1.0), k=(b-0.7)/0.3;  // faint sparkle cross on bright near ones
      gmax(x+2|0,y|0,sr,sg,sb,0.4*k); gmax(x-2|0,y|0,sr,sg,sb,0.4*k);
      gmax(x|0,y+2|0,sr,sg,sb,0.4*k); gmax(x|0,y-2|0,sr,sg,sb,0.4*k); }
  }
  for(let i=0;i<W*H;i++){
    const r=1-Math.exp(-FR[i]/255*1.7), g=1-Math.exp(-FG[i]/255*1.7), b=1-Math.exp(-FB[i]/255*1.7);
    buf[i*4]=r*255; buf[i*4+1]=g*255; buf[i*4+2]=b*255; buf[i*4+3]=Math.min(1,FA[i])*255;
  }
  return buf;
}

if(typeof document!=='undefined'){
  const cvs=document.getElementById('c'); const ctx=cvs.getContext('2d'); ctx.imageSmoothingEnabled=false;
  const LOOP=9.0; let t0=0;                                // long loop -> slow drift
  function frame(ts){ if(!t0)t0=ts; const p=(((ts-t0)*0.001)%LOOP)/LOOP;
    ctx.putImageData(new ImageData(render(p),W,H),0,0); requestAnimationFrame(frame); }
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
